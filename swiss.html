<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swiss Tournament</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card results-card">
    <h1>Swiss Tournament</h1>
    <p>Players will be paired for 3 rounds. First round is random; later rounds use similar scores.</p>
    <div id="roundSection">
      <h2 id="roundInfo"></h2>
      <div>
        <strong>Pairings</strong>
        <ul id="pairingsList"></ul>
      </div>
      <div>
        <strong>Round results</strong>
        <ul id="roundResults"></ul>
      </div>
      <div>
        <strong>Standings</strong>
        <ul id="roundScoreboard"></ul>
      </div>
      <button id="nextRoundButton">Submit results for round 1</button>
      <a id="finishLink" href="results.html" style="display:none; margin-left:1rem;">View final results</a>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
