<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Swiss Tournament</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card p-5 shadow-sm" style="max-width: 600px;">
    <h1 class="card-title">Swiss Tournament</h1>
    <p class="card-text text-muted">Players will be paired for 3 rounds. First round is random; later rounds use similar scores.</p>
    <div id="roundSection" class="mt-4">
      <h2 id="roundInfo" class="h5"></h2>
      <div class="mt-3">
        <strong>Pairings</strong>
        <ul id="pairingsList" class="list-unstyled mt-2"></ul>
      </div>
      <div class="mt-3">
        <strong>Round results</strong>
        <ul id="roundResults" class="list-group mt-2"></ul>
      </div>
      <div class="mt-3">
        <strong>Standings</strong>
        <ul id="roundScoreboard" class="list-group mt-2"></ul>
      </div>
      <button id="nextRoundButton" class="btn btn-primary mt-3">Submit results for round 1</button>
      <a id="finishLink" href="results.html" class="btn btn-success ms-2" style="display:none;">View final results</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
