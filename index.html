<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <title>Hello World</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card p-5 shadow-sm" style="max-width: 600px;">
    <h1 class="card-title mb-2">Tournament Organiser</h1>
    <p class="card-text text-muted">Welcome to the MTG Tournament Organiser.</p>
    <form id="tournamentForm" class="mt-4">
      <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
        <label for="playerCount" class="form-label me-2">Number of Players:</label>
        <input type="number" id="playerCount" class="form-control" style="width: 80px;" min="1" value="1">
        <button id="startTournament" class="btn btn-primary" type="submit">Start Tournament</button>
      </div>
      <div id="playerNamesContainer" class="mt-3"></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
