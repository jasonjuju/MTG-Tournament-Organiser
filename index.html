<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1>Tournament Organiser</h1>
    <p>Welcome to the MTG Tournament Organiser.</p>
    <form id="tournamentForm" style="margin-top:1rem; text-align:left;">
      <div style="margin-top:1.5rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
        <label for="playerCount">Number of Players:</label>
        <input type="number" id="playerCount" min="1" value="1" style="width:4rem;">
        <button id="startTournament" type="submit">Start Tournament</button>
      </div>
      <div id="playerNamesContainer" style="margin-top:1rem;"></div>
    </form>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
